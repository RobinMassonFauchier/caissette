services:
  - type: web
    name: caissette-robin
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /confidentialite
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: APP_URL
        value: https://caissette-robin.onrender.com
      - key: ALLOWED_EMAILS
        sync: false
